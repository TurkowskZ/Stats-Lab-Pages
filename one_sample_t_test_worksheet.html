<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Sample t Test Worksheet</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f7f7f8;
      color: #111;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .sheet {
      background: #fff;
      max-width: 820px;
      width: 100%;
      padding: 24px 30px 30px;
      border: 1px solid #ccc;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .sheet-title {
      text-align: center;
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 22px;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: start;
    }
    @media (max-width: 640px) {
      .grid-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .sheet {
        padding: 16px;
      }
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      border: 1px solid #000;
      padding: 4px 6px;
      text-align: center;
    }
    th {
      font-weight: 600;
      background: #fafafa;
    }
    .left-table {
      border: 2px solid #000;
    }
    .left-table th, .left-table td {
      border: 1px solid #000;
    }
    .left-table tfoot td {
      border-top: 2px solid #000;
    }
    .summary-table {
      border: 2px solid #000;
      width: 100%;
    }
    .summary-table td.label-col {
      text-align: left;
      font-weight: 500;
      padding-left: 10px;
      width: 48%;
      background: #fafafa;
    }
    .summary-table td.val-col {
      padding: 2px 4px;
    }
    /* Input field styling */
    input.calc-input {
      width: 100%;
      border: 1px solid transparent;
      outline: none;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.9rem;
      text-align: center;
      padding: 3px 2px;
      background: transparent;
      color: #111;
      transition: background 0.15s, border-color 0.15s;
    }
    input.calc-input:focus {
      border: 1px solid #000;
      background: #fff;
    }
    /* Feedback highlights */
    input.calc-input.valid {
      background-color: #dcfce7 !important;
      border: 1px solid #16a34a !important;
      color: #166534;
    }
    input.calc-input.invalid {
      background-color: #fee2e2 !important;
      border: 1px solid #dc2626 !important;
      color: #991b1b;
    }
    /* Formula boxes matching worksheet */
    .formula-box {
      border: 2px solid #000;
      padding: 9px;
      text-align: center;
      margin-top: 14px;
      background: #fff;
      font-family: "Times New Roman", Times, serif;
    }
    .formula-box.thick {
      border: 3px solid #000;
    }
    .fraction {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      padding: 0 4px;
    }
    .fraction-top {
      border-bottom: 1.5px solid #000;
      padding-bottom: 1px;
    }
    .fraction-bot {
      padding-top: 1px;
    }
    .formula-label {
      font-size: 1.05rem;
    }
    .ci-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      margin-top: 6px;
    }
    .ci-label {
      width: 55px;
      font-weight: 500;
      text-align: right;
    }
    .ci-input-wrap {
      border: 1px solid #000;
      padding: 2px 4px;
      width: 100px;
    }
    .cohen-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
    }
    .cohen-label {
      font-size: 0.9rem;
      font-weight: 500;
    }
    .cohen-input-wrap {
      border: 1px solid #000;
      padding: 2px 4px;
      width: 100px;
    }
    /* Buttons */
    .controls {
      margin-top: 26px;
      padding-top: 16px;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    button.btn {
      padding: 8px 22px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #000;
      background: #fff;
      color: #000;
      border-radius: 2px;
      transition: background 0.15s, color 0.15s;
    }
    button.btn:hover {
      background: #eee;
    }
    button.btn-primary {
      background: #111;
      color: #fff;
    }
    button.btn-primary:hover {
      background: #333;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="sheet-title">t-Test Hand Calculation!</div>

    <div class="grid-container">
      
      <!-- Left Column: Data Table -->
      <div>
        <table class="left-table">
          <thead>
            <tr>
              <th style="width: 45%;">Math score</th>
              <th style="width: 55%;">(Xi &minus; Xbar)^2</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Populated via script -->
          </tbody>
          <tfoot>
            <tr>
              <td style="text-align: left; padding: 4px 8px; font-weight: 500;">
                Sum
                <div style="float: right; width: 68px; border: 1px solid #000; padding: 1px;">
                  <input type="text" id="ans-sum-x" class="calc-input" />
                </div>
              </td>
              <td>
                <div style="width: 100%; border: 1px solid #000; padding: 1px;">
                  <input type="text" id="ans-sum-dev" class="calc-input" />
                </div>
              </td>
            </tr>
            <tr>
              <td style="text-align: left; padding: 4px 8px; font-weight: 500;">
                Mean/Var
                <div style="float: right; width: 68px; border: 1px solid #000; padding: 1px;">
                  <input type="text" id="ans-mean" class="calc-input" />
                </div>
              </td>
              <td>
                <div style="width: 100%; border: 1px solid #000; padding: 1px;">
                  <input type="text" id="ans-var" class="calc-input" />
                </div>
              </td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Right Column: Summary Table and Formulas -->
      <div>
        <table class="summary-table">
          <tbody>
            <tr>
              <td class="label-col">n</td>
              <td class="val-col"><input type="text" id="ans-n" class="calc-input" /></td>
            </tr>
            <tr>
              <td class="label-col">mean</td>
              <td class="val-col"><input type="text" id="ans-mean-box" class="calc-input" /></td>
            </tr>
            <tr>
              <td class="label-col">var</td>
              <td class="val-col"><input type="text" id="ans-var-box" class="calc-input" /></td>
            </tr>
            <tr>
              <td class="label-col">std dev</td>
              <td class="val-col"><input type="text" id="ans-std-dev" class="calc-input" /></td>
            </tr>
            <tr>
              <td class="label-col">std error</td>
              <td class="val-col"><input type="text" id="ans-std-err" class="calc-input" /></td>
            </tr>
            <tr>
              <td class="label-col">pop mean</td>
              <td class="val-col"><input type="text" id="ans-pop-mean" class="calc-input" value="85" /></td>
            </tr>
            <tr>
              <td class="label-col">alpha</td>
              <td class="val-col"><input type="text" id="ans-alpha" class="calc-input" value="0.05" /></td>
            </tr>
            <tr>
              <td class="label-col">tails</td>
              <td class="val-col"><input type="text" id="ans-tails" class="calc-input" value="2" /></td>
            </tr>
            <tr>
              <td class="label-col">df</td>
              <td class="val-col"><input type="text" id="ans-df" class="calc-input" /></td>
            </tr>
            <tr>
              <td class="label-col" style="background: #eee;">t stat</td>
              <td class="val-col"><input type="text" id="ans-t-stat" class="calc-input" /></td>
            </tr>
            <tr>
              <td class="label-col">p value</td>
              <td class="val-col"><input type="text" id="ans-p-val" class="calc-input" /></td>
            </tr>
            <tr>
              <td class="label-col">t crit</td>
              <td class="val-col"><input type="text" id="ans-t-crit" class="calc-input" /></td>
            </tr>
          </tbody>
        </table>

        <!-- Formula: t statistic -->
        <div class="formula-box thick" style="margin-top: 14px;">
          <span class="formula-label">
            t = 
            <span class="fraction">
              <span class="fraction-top">x&#772; &minus; &mu;</span>
              <span class="fraction-bot">&radic;(s<sup>2</sup> / n)</span>
            </span>
          </span>
        </div>

        <!-- Confidence Interval Inputs -->
        <div style="margin-top: 14px;">
          <div class="ci-row">
            <span class="ci-label">CI UL</span>
            <div class="ci-input-wrap">
              <input type="text" id="ans-ci-ul" class="calc-input" />
            </div>
          </div>
          <div class="ci-row">
            <span class="ci-label">CI LL</span>
            <div class="ci-input-wrap">
              <input type="text" id="ans-ci-ll" class="calc-input" />
            </div>
          </div>
        </div>

        <!-- Formula: Confidence Interval -->
        <div class="formula-box thick" style="margin-top: 10px; font-size: 0.95rem;">
          CI<sub>1&minus;&alpha;</sub> = 
          x&#772; &plusmn; t<sub>&alpha;/2</sub>(s<sub>x&#772;</sub>) = 
          x&#772; &plusmn; t<sub>&alpha;/2</sub>
          <span class="fraction">
            <span class="fraction-top">s</span>
            <span class="fraction-bot">&radic;n</span>
          </span>
        </div>

        <!-- Cohen's d Input and Formula -->
        <div class="cohen-row">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="cohen-label">Cohen's d</span>
            <div class="cohen-input-wrap">
              <input type="text" id="ans-cohen-d" class="calc-input" />
            </div>
          </div>

          <div class="formula-box thick" style="margin: 0; padding: 6px 14px; font-size: 0.95rem;">
            <span class="fraction">
              <span class="fraction-top">x&#772; &minus; &mu;</span>
              <span class="fraction-bot">s</span>
            </span>
          </div>
        </div>

      </div>
    </div>

    <!-- Student Controls -->
    <div class="controls">
      <button class="btn btn-primary" onclick="checkWork()">Check Answers</button>
      <button class="btn" onclick="clearWork()">Clear</button>
    </div>
  </div>

  <script>
    const scores = [84, 95, 53, 96, 82, 79, 68, 93, 90, 88, 85, 99, 100, 91, 90];
    const devSquared = [4.84, 77.44, 1102.24, 96.04, 17.64, 51.84, 331.24, 46.24, 14.44, 3.24, 1.44, 163.84, 190.44, 23.04, 14.44];

    const answers = {
      'ans-sum-x': { target: 1293, tol: 0.5 },
      'ans-sum-dev': { target: 2138.4, tol: 0.5 },
      'ans-mean': { target: 86.2, tol: 0.05 },
      'ans-var': { target: 152.74, tol: 0.1 },
      'ans-n': { target: 15, tol: 0.01 },
      'ans-mean-box': { target: 86.2, tol: 0.05 },
      'ans-var-box': { target: 152.74, tol: 0.1 },
      'ans-std-dev': { target: 12.36, tol: 0.05 },
      'ans-std-err': { target: 3.191, tol: 0.03 },
      'ans-pop-mean': { target: 85, tol: 0.01 },
      'ans-alpha': { target: 0.05, tol: 0.005 },
      'ans-tails': { target: 2, tol: 0.01 },
      'ans-df': { target: 14, tol: 0.01 },
      'ans-t-stat': { target: 0.376, tol: 0.03 },
      'ans-p-val': { target: 0.712, tol: 0.03 },
      'ans-t-crit': { target: 2.144, tol: 0.03 },
      'ans-ci-ul': { target: 93.04, tol: 0.1 },
      'ans-ci-ll': { target: 79.36, tol: 0.1 },
      'ans-cohen-d': { target: 0.097, tol: 0.02 }
    };

    function initTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      scores.forEach((val, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${val}</td>
          <td><input type="text" id="dev-${i}" class="calc-input" /></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function checkWork() {
      devSquared.forEach((target, i) => {
        const el = document.getElementById(`dev-${i}`);
        if (!el) return;
        const val = parseFloat(el.value.trim());
        el.classList.remove('valid', 'invalid');
        if (!isNaN(val)) {
          if (Math.abs(val - target) <= 0.08) {
            el.classList.add('valid');
          } else {
            el.classList.add('invalid');
          }
        }
      });

      for (const id in answers) {
        const el = document.getElementById(id);
        if (!el) continue;
        const val = parseFloat(el.value.trim());
        el.classList.remove('valid', 'invalid');
        if (!isNaN(val)) {
          if (Math.abs(val - answers[id].target) <= answers[id].tol) {
            el.classList.add('valid');
          } else {
            el.classList.add('invalid');
          }
        }
      }
    }

    function clearWork() {
      document.querySelectorAll('.calc-input').forEach(el => {
        if (el.id === 'ans-pop-mean') {
          el.value = '85';
        } else if (el.id === 'ans-alpha') {
          el.value = '0.05';
        } else if (el.id === 'ans-tails') {
          el.value = '2';
        } else {
          el.value = '';
        }
        el.classList.remove('valid', 'invalid');
      });
    }

    window.onload = initTable;
  </script>
</body>
</html>
